{% extends "base.html" %}
{% block content %}

<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow border-0">
            <div class="card-body p-4">
                
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h3 class="card-title m-0">Edit Profile</h3>
                    <span class="badge {% if user.role == 'manager' %}bg-danger{% else %}bg-primary{% endif %} text-uppercase px-3 py-2">
                        {{ user.role }} Account
                    </span>
                </div>
                
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Full Name</label>
                        <input type="text" name="name" class="form-control" value="{{ user.name }}" required>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label fw-bold">Email Address</label>
                        <input type="email" name="email" class="form-control" value="{{ user.email }}" required>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label fw-bold">New Password <small class="text-muted fw-normal">(Leave blank to keep current)</small></label>
                        <input type="password" name="password" class="form-control" placeholder="Enter new password">
                    </div>
                    
                    <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">Save Changes</button>
                </form>
                
                <div class="mt-4 text-center">
                    {% if user.role == 'manager' %}
                        <a href="{{ url_for('manager_dashboard') }}" class="btn btn-outline-secondary btn-sm">← Back to Manager Dashboard</a>
                    {% else %}
                        <a href="{{ url_for('guest_dashboard') }}" class="btn btn-outline-secondary btn-sm">← Back to Guest Dashboard</a>
                    {% endif %}
                </div>

            </div>
        </div>
    </div>
</div>

{% endblock %}
